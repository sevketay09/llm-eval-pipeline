openapi: 3.0.0
info:
  title: LLM Evaluation Pipeline API
  description: |
    Comprehensive LLM evaluation framework for Turkish and fintech-focused model testing.
    
    ## Features
    - Turkish language benchmarks (grammar, creativity, reasoning, nuance)
    - Fintech domain testing (knowledge, calculations, compliance)
    - Function calling and agentic workflows
    - Multi-turn conversations and RAG evaluation
    - PII detection and safety testing
    - Adversarial resilience and jailbreak testing
    - Language mix handling (Turkish-English)
    - Self-consistency and prompt compression
    - Human-in-the-loop feedback integration
    
  version: 2.0.0
  contact:
    name: LLM Eval Pipeline Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8501
    description: Local Streamlit Dashboard
  - url: http://localhost:8000
    description: Local API Server (if deployed)

tags:
  - name: Evaluation
    description: Model evaluation endpoints
  - name: Reports
    description: Report generation and retrieval
  - name: Configuration
    description: Configuration management
  - name: Human Feedback
    description: Human-in-the-loop feedback endpoints

paths:
  /api/v1/evaluate:
    post:
      tags:
        - Evaluation
      summary: Run evaluation on specified models
      description: |
        Execute evaluation suite on one or more LLM.
        Supports various test suites and configuration options.
      operationId: runEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
            examples:
              basic:
                summary: Basic evaluation
                value:
                  models:
                    - gpt-4
                  test_suite: smoke
              full:
                summary: Full evaluation
                value:
                  models:
                    - gpt-4
                    - claude-3-sonnet
                  test_suite: full
                  max_samples: 100
      responses:
        '200':
          description: Evaluation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/evaluate/async:
    post:
      tags:
        - Evaluation
      summary: Start async evaluation job
      description: |
        Start evaluation as background job and return job ID.
        Use /api/v1/jobs/{jobId} to check status.
      operationId: startAsyncEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '202':
          description: Evaluation job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

  /api/v1/jobs/{jobId}:
    get:
      tags:
        - Evaluation
      summary: Get job status
      description: Check status of async evaluation job
      operationId: getJobStatus
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/reports:
    get:
      tags:
        - Reports
      summary: List available reports
      description: Get list of all generated evaluation reports
      operationId: listReports
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Reports list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsList'

  /api/v1/reports/{reportId}:
    get:
      tags:
        - Reports
      summary: Get specific report
      description: Retrieve detailed evaluation report by ID
      operationId: getReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReport'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/reports/{reportId}/compare:
    post:
      tags:
        - Reports
      summary: Compare multiple reports
      description: Generate comparison between multiple evaluation reports
      operationId: compareReports
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compare_with:
                  type: array
                  items:
                    type: string
                  description: List of report IDs to compare with
      responses:
        '200':
          description: Comparison generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonReport'

  /api/v1/config/models:
    get:
      tags:
        - Configuration
      summary: Get model configurations
      description: Retrieve available model configurations
      operationId: getModelConfigs
      responses:
        '200':
          description: Model configs retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfigs'

  /api/v1/config/tests:
    get:
      tags:
        - Configuration
      summary: Get test configurations
      description: Retrieve test suite configurations and thresholds
      operationId: getTestConfigs
      responses:
        '200':
          description: Test configs retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestConfigs'

  /api/v1/feedback/submit:
    post:
      tags:
        - Human Feedback
      summary: Submit human feedback
      description: Submit human evaluation feedback for a specific test result
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmission'
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'

  /api/v1/feedback/calibration:
    get:
      tags:
        - Human Feedback
      summary: Get judge calibration metrics
      description: Retrieve calibration metrics comparing judge scores with human feedback
      operationId: getCalibrationMetrics
      responses:
        '200':
          description: Calibration metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationMetrics'

components:
  schemas:
    EvaluationRequest:
      type: object
      required:
        - models
        - test_suite
      properties:
        models:
          type: array
          items:
            type: string
          description: List of model identifiers to evaluate
          example: ["gpt-4", "claude-3-sonnet"]
        test_suite:
          type: string
          enum: [smoke, turkish_skills, fintech_only, full, full_local, benchmarks, advanced, regression]
          description: Test suite to run
          example: smoke
        max_samples:
          type: integer
          minimum: 1
          description: Maximum number of samples per test (overrides config)
          example: 100
        parallel:
          type: boolean
          default: true
          description: Whether to run tests in parallel
        judge_model:
          type: string
          description: Model to use as judge (optional)
          example: gpt-4-turbo
        cache_enabled:
          type: boolean
          default: true
          description: Whether to use result caching

    EvaluationResponse:
      type: object
      properties:
        status:
          type: string
          enum: [completed, failed, partial]
        timestamp:
          type: string
          format: date-time
        report_id:
          type: string
        summary:
          $ref: '#/components/schemas/EvaluationSummary'
        models:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelResults'

    EvaluationSummary:
      type: object
      properties:
        total_tests:
          type: integer
        total_cost:
          type: number
        total_time:
          type: number
        model_comparison:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelComparison'
        best_performers:
          type: object

    ModelComparison:
      type: object
      properties:
        overall_score:
          type: number
          minimum: 0
          maximum: 1
        avg_latency:
          type: number
        latency_p95:
          type: number
        total_cost:
          type: number
        passed_thresholds:
          type: boolean

    ModelResults:
      type: object
      properties:
        model_name:
          type: string
        tests:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TestResults'

    TestResults:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/TestSummary'
        results:
          type: array
          items:
            type: object

    TestSummary:
      type: object
      properties:
        overall_score:
          type: number
        total_tests:
          type: integer
        avg_latency:
          type: number
        total_cost:
          type: number
        avg_scores:
          type: object
          additionalProperties:
            type: number

    JobResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
        created_at:
          type: string
          format: date-time

    JobStatus:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        progress:
          type: number
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/EvaluationResponse'

    ReportsList:
      type: object
      properties:
        total:
          type: integer
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportSummary'

    ReportSummary:
      type: object
      properties:
        report_id:
          type: string
        timestamp:
          type: string
          format: date-time
        models:
          type: array
          items:
            type: string
        test_suite:
          type: string
        overall_score:
          type: number

    EvaluationReport:
      type: object
      properties:
        report_id:
          type: string
        timestamp:
          type: string
        summary:
          $ref: '#/components/schemas/EvaluationSummary'
        models:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelResults'

    ComparisonReport:
      type: object
      properties:
        reports:
          type: array
          items:
            type: string
        comparison:
          type: object
          properties:
            score_changes:
              type: object
            performance_trends:
              type: object
            cost_analysis:
              type: object

    ModelConfigs:
      type: object
      properties:
        models:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelConfig'

    ModelConfig:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        temperature:
          type: number
        max_tokens:
          type: integer

    TestConfigs:
      type: object
      properties:
        test_suites:
          type: object
        metric_weights:
          type: object
          additionalProperties:
            type: number
        thresholds:
          type: object
          additionalProperties:
            type: number

    FeedbackSubmission:
      type: object
      required:
        - test_id
        - model
        - rating
      properties:
        test_id:
          type: string
        model:
          type: string
        test_type:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        feedback_text:
          type: string
        annotator_id:
          type: string

    FeedbackResponse:
      type: object
      properties:
        feedback_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    CalibrationMetrics:
      type: object
      properties:
        total_comparisons:
          type: integer
        agreement_rate:
          type: number
        mean_absolute_error:
          type: number
        correlation:
          type: number
        by_category:
          type: object
          additionalProperties:
            type: object

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
