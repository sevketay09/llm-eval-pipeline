services:
  llm-eval-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-eval-dashboard
    ports:
      - "8001:8001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
