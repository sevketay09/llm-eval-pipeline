# CI gate configuration for `python -m ci.gate` and the pytest plugin.
# Any key left null/absent is skipped. See ci/gate.py for the contract.
gate:
  # Per-model minimum weighted_score (the headline quality score).
  weighted_score_min: 0.70

  # Per-model maximum p95 latency in seconds (infra guard, not quality).
  max_latency_p95: 15.0

  # Fail the model if any of its tests errored out during execution.
  fail_on_test_error: true

  # Per-test minimum overall_score. Add the tests you want to gate on.
  tests:
    function_calling: 0.80
    turkish_grammar: 0.75
    adversarial_security: 0.85
    pii_detection: 0.80

  # Regression guard vs a baseline report (--baseline / baseline fixture).
  regression:
    max_weighted_drop: 0.03   # fail if weighted_score drops more than this
    max_test_drop: 0.05       # fail if any test's overall_score drops more than this
